<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <title>Speech to Text - Kiswahili</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #fff;
      font-family: 'Arial', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #startBtn {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 25px;
      font-size: 16px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      z-index: 1000;
    }

    #startBtn.listening {
      background: #dc3545;
    }

    #textDisplay {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      font-size: 36px;
      line-height: 1.5;
      color: white;
      background-color: black;
    }

    @media (max-width: 600px) {
      #textDisplay {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>

  <button id="startBtn">Anza Kusikiliza</button>
  <div id="textDisplay">Maandishi yataonekana hapa ukianza kuimba...</div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const textDisplay = document.getElementById('textDisplay');

    let recognition;
    let isListening = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      recognition = new SpeechRecognition();
      recognition.lang = 'sw-TZ'; // Kiswahili Tanzania
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onresult = (event) => {
        let transcript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          transcript += event.results[i][0].transcript;
        }
        textDisplay.textContent = transcript;
      };

      recognition.onend = () => {
        if (isListening) {
          recognition.start(); // Ended? Start again
        }
      };

      recognition.onerror = (event) => {
        console.error('Kosa:', event.error);
        if (isListening) {
          recognition.stop();
          recognition.start(); // Restart on error
        }
      };
    } else {
      alert("Samahani, browser yako haiungi mkono Speech Recognition.");
    }

    startBtn.addEventListener('click', () => {
      if (!isListening) {
        recognition.start();
        startBtn.textContent = "Zima Kusikiliza";
        startBtn.classList.add('listening');
        isListening = true;
        textDisplay.textContent = "Inasubiri sauti yako...";
      } else {
        recognition.stop();
        startBtn.textContent = "Anza Kusikiliza";
        startBtn.classList.remove('listening');
        isListening = false;
        textDisplay.textContent = "Maandishi yataonekana hapa ukianza kuimba...";
      }
    });
  </script>

</body>
</html>
